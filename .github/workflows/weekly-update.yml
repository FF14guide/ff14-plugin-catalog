name: Weekly catalog update

on:
  schedule:
    # 毎週日曜 18:00 UTC（日本時間 月曜 03:00）
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # 公式リポジトリが取得できなかった場合は fetch.js が異常終了し、前回のカタログを壊さない
      - name: Fetch repositories and rebuild the catalog data
        run: npm run update
      - name: Check the site builds
        run: npm run build
      # データに変化があった週だけコミットする。コミットが入ると Cloudflare が自動でビルド・公開する。
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json icons_small
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update plugin catalog data"
            git push
          fi
